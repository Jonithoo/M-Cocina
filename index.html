<script>
/* ===== Conexión con Gemini (reemplaza la versión de claude.ai) ===== */
const GK="cfa_key",GM="cfa_model",GDEF="gemini-flash-latest";
const gkey=()=>{try{return localStorage.getItem(GK)||""}catch(e){return ""}};
const gmodel=()=>{try{return localStorage.getItem(GM)||GDEF}catch(e){return GDEF}};
const up=s=>Array.isArray(s)?s.map(up):s&&typeof s=="object"?Object.fromEntries(Object.entries(s).map(([k,v])=>[k,k=="type"&&typeof v=="string"?v.toUpperCase():up(v)])):s;
async function gem(contents,o={}){
const k=gkey();if(!k)throw {code:"nokey"};
const body={contents,generationConfig:{}};
if(o.sys)body.systemInstruction={parts:[{text:o.sys}]};
if(o.json)body.generationConfig.responseMimeType="application/json";
if(o.tools)body.tools=[{functionDeclarations:o.tools.map(t=>({name:t.name,description:t.description,parameters:up(t.inputSchema)}))}];
let r,j;
try{r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(gmodel())+":generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":k},body:JSON.stringify(body)});j=await r.json()}
catch(e){throw {code:"net",message:"Sin conexión a internet."}}
if(!r.ok)throw {code:r.status==429?"rate_limited":(r.status==400||r.status==403||r.status==404)?"badkey":"err",message:(j.error&&j.error.message)||("Error "+r.status)};
return j}
async function run(contents,o){
for(let i=0;i<5;i++){
const j=await gem(contents,o);const c=j.candidates&&j.candidates[0];
const parts=(c&&c.content&&c.content.parts)||[];const calls=parts.filter(p=>p.functionCall);
if(!calls.length)return parts.map(p=>p.text||"").join("").trim();
contents.push({role:"model",parts});const resp=[];
for(const p of calls){const t=o.tools.find(x=>x.name==p.functionCall.name);let out;
try{out={result:t?await t.execute(p.functionCall.args||{}):"herramienta desconocida"}}catch(e){out={error:String(e.message||e)}}
resp.push({functionResponse:{name:p.functionCall.name,response:out}})}
contents.push({role:"user",parts:resp})}
return "Listo ✅"}
async function send(){
const inp=$("ci"),t=inp.value.trim();if(!t||busy)return;inp.value="";cmsg("u",t);
if(!gkey()){cmsg("a","Primero cargá tu clave de Gemini en ⚙️ (arriba a la derecha).");$("cfg").style.display="block";return}
busy=true;const out=cmsg("a","Pensando…");
H.push({role:"user",content:t});H=H.slice(-12);while(H[0]&&H[0].role!="user")H.shift();
const ct=H.map((m,i)=>({role:m.role=="user"?"user":"model",parts:[{text:i==H.length-1?ctx()+"\n\nMENSAJE: "+t:m.content}]}));
try{const r=await run(ct,{sys:SYS,tools:TL});out.textContent=r||"Listo ✅";say(r);H.push({role:"assistant",content:r||"Listo"})}
catch(e){out.textContent=e.code=="rate_limited"?"Llegaste al límite gratis por ahora. Esperá un rato y probá de nuevo.":e.code=="badkey"?"Gemini rechazó la clave o el modelo ("+(e.message||"")+"). Revisá ⚙️.":"Uy, no pude responder. "+(e.message||"");H.pop()}
busy=false}
async function imp(){
const t=$("imp").value.trim(),st=$("ims");if(t.length<20)return st.textContent="Pegá más texto.";
if(!gkey())return st.textContent="Primero cargá tu clave en ⚙️ (dentro de Chef Che).";
$("impb").disabled=true;st.textContent="Armando…";
try{const j=await gem([{role:"user",parts:[{text:`Extraé la receta del texto. Respondé SOLO JSON: {"n":"nombre","st":"pasos en 2 a 6 oraciones cortas, en español rioplatense","q":"cantidades como texto, o vacío","ing":["ingredientes en minúscula, sin cantidades"]}. Si un ingrediente equivale a uno de esta lista, usá exactamente ese nombre: ${allIng.join(", ")}. Ignorá sal y agua.\n\nTEXTO:\n${t.slice(0,12000)}`}]}],{json:true});
const r=JSON.parse(j.candidates[0].content.parts.map(p=>p.text||"").join("").replace(/```json|```/g,""));
D.n=r.n||"";D.st=r.st||"";D.q=r.q||"";const m=t.match(/https?:\/\/(www\.)?(youtube\.com|youtu\.be)\/\S+/);if(m)D.yt=m[0];
D.ing=[...new Set((r.ing||[]).map(clean).filter(Boolean))];D.ing.forEach(x=>{if(!allIng.includes(x))S.extra.push(x)});save();tab="mis";draw();$("df").scrollIntoView({block:"center"})}
catch(e){st.textContent="No pude armarla: "+(e.message||e.code||"probá de nuevo");$("impb").disabled=false}}
/* ===== Ajustes + copia de seguridad ===== */
function cfgT(){const c=$("cfg");c.style.display=c.style.display=="block"?"none":"block";$("gk").value=gkey();$("gm").value=gmodel()}
function cfgS(){try{localStorage.setItem(GK,$("gk").value.trim());localStorage.setItem(GM,$("gm").value.trim()||GDEF)}catch(e){}$("cfg").style.display="none";cmsg("a","¡Guardado! Ya podés preguntarme.")}
function bkO(){const b=new Blob([JSON.stringify(S)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="cocina-copia-"+tod()+".json";document.body.appendChild(a);a.click();a.remove()}
function bkI(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!="object")throw 0;S=Object.assign({have:[],notes:[],hist:[],mine:[],extra:[],ov:{}},d);save();draw();alert("Copia restaurada ✅")}catch(e){alert("Ese archivo no es una copia válida.")}};r.readAsText(f)}
/* ===== App instalable ===== */
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
