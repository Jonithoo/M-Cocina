<style>
:root{--bg:#fdf8ef;--card:#fff;--tx:#3b3226;--mu:#8a7c68;--ac:#e07a3f;--ok:#4f9d69;--no:#c9584c;--bd:#eadfcb;--chip:#f6ecd9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1b16;--card:#2a251e;--tx:#f1e8d8;--mu:#b3a58f;--bd:#3d362b;--chip:#352f25}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg); color:var(--tx); font-family:system-ui, -apple-system, Segoe UI, sans-serif;max-width:640px;margin:auto;padding:12px 12px 80px}
h1{font-size:20px;margin:4px 0}.date{color:var(--mu); font-size:14px;text-transform:capitalize}
.tip{background:var(--chip); border:1px solid var(--bd); border-radius: 14px;padding:10px 12px;margin:10px 0;font-size: 14px; cursor:pointer}
nav{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top, 0px); background:var(--bg);padding:6px 0;z-index:5}
nav button{flex: 1; padding: 9px 2px; border:1px solid var(--bd); background:var(--card);color:var(--tx);border-radius: 12px;font-size:12px}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input, select, textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius: 12px; background:var(--card);color:var(--tx);font:inherit; margin:4px 0}
.btn{background:var(--ac);color:#fff;border:0;border-radius: 12px;padding:10px 14px;font:inherit; font-weight:600}
.btn.g{background:var(--chip);color:var(--tx);border:1px solid var(--bd)}.btn.ok{background:var(--ok)}
.card{background:var(--card);border:1px solid var(--bd);border-radius: 14px;padding: 10px 12px;margin:8px 0}
summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.b{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--chip)}.b.ok{background:var(--ok);color:#fff}.b.no{background:var(--no);color:#fff}
.chips{display:flex; flex-wrap:wrap;gap:6px;margin:6px 0}.chip{padding:6px 10px;border-radius:99px;border:1px solid var(--bd); background:var(--card);color:var(--tx); font-size:13px}.chip.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.mu{color:var(--mu); font-size: 13px}.y{color:var(--no); text-decoration:none;font-weight:600}li{margin:3px 0}ul{padding-left:18px;margin:6px 0}
.x{background:none;border:0;color:var(--no); font-size:18px}
#chb{position:fixed; right: 14px;bottom:calc(16px + env(safe-area-inset-bottom, 0px));z-index:20;border:0;border-radius:99px;padding:12px 16px;background:var(--ac);color:#fff; font:600 15px system-ui;box-shadow:0 4px 14px #0004}
#chp{display:none;position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:auto;height:72%;z-index:30;background:var(--bg); border:1px solid var(--bd); border-radius: 18px 18px 0 0;padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); flex-direction:column}
#chp.on{display:flex}#cms{flex:1;overflow:auto;display: flex; flex-direction:column;gap:6px;padding:6px 0}
.m{padding:8px 11px;border-radius: 14px; max-width:88%;white-space: pre-wrap;font-size:15px}.m.u{align-self:flex-end;background:var(--ac);color:#fff}.m.a{align-self:flex-start; background:var(--chip)}.done{text-decoration:line-through;color:var(--mu)}
</style>

<body>
<h1>Cocina Familiar Argentina</h1>
<div class="date" id="date"></div>
<div class="tip" id="tip"></div>
<nav id="nav"></nav>
<div id="app"></div>
<button id="chb" onclick="cp()">Chef Che</button>
<div id="chp">
  <div class="row sp">
    <b>Chef Che tu ayudante de cocina</b>
    <button class="x" onclick="cfgT()">⚙️</button>
    <button class="x" onclick="cp()">X</button>
  </div>
  <div id="cfg" class="card" style="display:none">
    <b>Conexión con Gemini</b>
    <p class="mu">Pegá tu clave de Google AI Studio. Queda guardada solo en este celular.</p>
    <input id="gk" type="password" placeholder="Clave de Gemini (empieza con AIza...)" autocomplete="off">
    <p class="mu">Seleccioná el modelo:</p>
    <select id="gm">
      <option value="gemini-1.5-flash">gemini-1.5-flash (Estable / Rápido)</option>
      <option value="gemini-2.5-flash">gemini-2.5-flash (Avanzado)</option>
      <option value="gemini-1.5-pro">gemini-1.5-pro (Máxima capacidad)</option>
    </select>
    <button class="btn" onclick="cfgS()">Guardar</button>
    <p class="mu" style="margin-top:10px"><b>Copia de seguridad</b></p>
    <div class="row">
      <button class="btn g" onclick="bkO()">Guardar copia</button>
      <label class="btn g">↑ Restaurar<input type="file" accept="application/json" style="display:none" onchange="bkl(this.files[0])"></label>
    </div>
  </div>
  <div id="cms"></div>
  <div class="chips">
    <button class="chip" onclick="sq('¿Con qué puedo reemplazar lo que me falta?')">Reemplazos</button>
    <button class="chip" onclick="sq('¿Cómo sé que está listo?')">Punto justo</button>
    <button class="chip" onclick="sq('Agregá a esta receta lo que le falte y anotá lo que tengo que comprar')">+ Completar receta</button>
  </div>
  <div class="row">
    <input id="ci" placeholder="Preguntale a Chef Che..." style="flex:1;width:auto" onkeydown="if(event.key=='Enter')send()">
    <button class="btn g" id="mic" onclick="mic()">🎤</button>
    <button class="btn g" id="spk" onclick="spk()">🔊</button>
    <button class="btn" onclick="send()">></button>
  </div>
</div>
<script>
const R=[
["Asado de tira y vacío","Carnes","carne de asado, vacío, chorizo, morcilla, chinchulines, carbón, chimichurri", "Prender brasas 40 min. Cocinar a fuego bajo 1.5-2 h, primero el lado del hueso. Sal gruesa al final de cada lado. Chorizo y morcilla al principio como picada."],
["Choripán", "Carnes", "chorizo, pan francés, chimichurri, tomate", "Grillar chorizos mariposa 15 min. Armar en pan con chimichurri y tomate."],
["Milanesa de nalga con puré", "Carnes","nalga, huevos, pan rallado, ajo, perejil, papas, leche, manteca", "Pasar la carne por huevo con ajo y perejil, luego pan rallado. Freír u hornear. Hacer el puré con papa hervida, leche y manteca."],
["Milanesa a la napolitana", "Carnes","nalga, huevos, pan rallado, jamón cocido, queso muzzarella, salsa de tomate","Milanesa lista, cubrir con salsa, jamón y muzzarella. Gratinar 10 min."],
["Bife de chorizo con papas fritas", "Carnes", "bife de chorizo, papas, aceite, sal gruesa", "Sellar el bife en plancha bien caliente 4-5 min por lado. Papas fritas en aceite caliente."],
["Matambre a la pizza", "Carnes", "matambre, salsa de tomate, queso muzzarella, orégano, aceitunas", "Hornear matambre 1 h, cubrir con salsa, muzzarella, orégano y aceitunas. Gratinar."],
["Matambre relleno", "Carnes", "matambre, huevos, zanahoria, morrón, espinaca, ajo, perejil", "Rellenar con huevo duro, zanahoria, morrón y espinaca. Enrollar, atar y hervir 1.5 h. Servir frío."],
["Bondiola braseada", "Carnes", "bondiola, cebolla, vino tinto, caldo, ajo, papas", "Dorar la bondiola, agregar cebolla, vino y caldo. Cocinar tapada 2.5 h a fuego bajo."],
["Pollo al horno con papas", "Carnes", "pollo, papas, cebolla, limón, ajo, morrón","Marinar pollo con ajo y limón. Hornear con papas y cebolla a 200° unos 70 min."],
["Colita de cuadril al horno","Carnes","colita de cuadril, papas, cebolla, mostaza, vino blanco", "Sellar la pieza, hornear con papas y cebolla 1 h. Reposar antes de cortar."],
["Estofado de carne", "Guisos","roast beef, papas, zanahoria, cebolla, salsa de tomate, caldo, arvejas", "Dorar la carne, agregar verduras y salsa. Cocinar tapado 1.5 h."],
["Guiso de lentejas","Guisos","lentejas, chorizo colorado, panceta, papas, zanahoria, cebolla, morrón, salsa de tomate", "Rehogar cebolla, morrón y panceta. Sumar lentejas, verduras, salsa y agua. Hervir 40 min."],
["Locro", "Guisos","maíz blanco, porotos, zapallo, panceta, chorizo colorado, falda, cebolla de verdeo, pimentón", "Remojar maíz y porotos la noche anterior. Hervir con carnes 3 h, sumar zapallo. Servir con salsa de cebolla de verdeo y pimentón."],
["Carbonada criolla","Guisos","carne, zapallo, choclo, papas, batata, duraznos, cebolla, salsa de tomate", "Rehogar cebolla y carne, agregar verduras y salsa. Cocinar 1 h, sumar los duraznos al final."],
["Puchero", "Guisos", "falda, gallina, chorizo colorado, papas, batata, zapallo, choclo, zanahoria, repollo", "Hervir las carnes 1.5 h y sumar las verduras escalonadas. Servir todo junto con caldo."],
["Guiso de arroz con pollo", "Guisos","arroz, pollo, morrón, cebolla, salsa de tomate, arvejas", "Dorar el pollo, rehogar verduras, sumar arroz y agua. Cocinar 20 min."],
["Ñoquis de papa", "Pastas","papas, harina, huevos, salsa de tomate, queso rallado","Puré de papa + harina + huevo. Armar cilindros y cortar. Hervir hasta que floten. Servir con salsa."],
["Fideos con tuco", "Pastas", "fideos, salsa de tomate, cebolla, morrón, carne picada, queso rallado", "Hacer un tuco con cebolla, morrón y carne picada. Hervir fideos y mezclar."],
["Ravioles de verdura con salsa", "Pastas", "ravioles, salsa de tomate, queso rallado, albahaca","Hervir ravioles 4-5 min. Servir con salsa y queso rallado."],
["Canelones de verdura y ricota","Pastas","panqueques, ricota, espinaca, jamón cocido, queso muzzarella, salsa blanca, salsa de tomate", "Rellenar panqueques con espinaca y ricota. Bañar con salsa blanca y de tomate. Gratinar."],
["Sorrentinos de jamón y queso", "Pastas","sorrentinos, salsa de tomate, crema, queso rallado", "Hervir 5 min. Servir con salsa rosa (tomate + crema)."],
["Lasagna", "Pastas","láminas de lasagna, carne picada, jamón cocido, queso muzzarella, salsa blanca, salsa de tomate", "Armar capas de pasta, boloñesa, jamón, queso y blanca. Hornear 40 min."],
["Empanadas de carne (salteñas)","Empanadas","tapas de empanada, carne picada, cebolla, huevos, aceitunas, comino, pimentón", "Rehogar cebolla y carne con especias. Rellenar con huevo y aceituna. Repulgue y hornear 20 min a 220°"],
["Empanadas de jamón y queso", "Empanadas","tapas de empanada, jamón cocido, queso muzzarella", "Rellenar, cerrar y hornear 15-20 min."],
["Empanadas de humita", "Empanadas", "tapas de empanada, choclo, cebolla, queso cremoso, leche, pimentón", "Hacer una salsa espesa con choclo, cebolla y leche. Rellenar y hornear."],
["Tarta de jamón y queso", "Tartas", "tapas de tarta, jamón cocido, queso muzzarella, huevos, crema de leche", "Mezclar relleno con huevos y crema. Hornear 35 min."],
["Pascualina", "Tartas", "tapas de tarta, espinaca, ricota, huevos, cebolla, queso rallado", "Rehogar espinaca, mezclar con ricota. Rellenar, poner huevos enteros y tapar. Hornear 40 min."],
["Tarta de zapallitos", "Tartas","tapas de tarta, zapallitos, cebolla, huevos, queso cremoso, crema de leche", "Saltear zapallitos y cebolla. Mezclar con huevos y queso. Hornear 35 min."],
["Revuelto Gramajo","Rápidas","papas, jamón cocido, huevos, cebolla, aceite", "Freír papas en fósforos, sumar jamón y cebolla, agregar huevos batidos y revolver."],
["Provoleta a la parrilla", "Rápidas","provolone, orégano, ají molido, aceite de oliva","Grillar la provoleta hasta que se derrita. Condimentar con orégano y ají."],
["Tortilla de papas", "Rápidas","papas, huevos, cebolla, aceite", "Freír papas y cebolla a fuego bajo. Mezclar con huevos y cuajar de ambos lados."],
["Pizza de muzzarella casera", "Rápidas","harina, levadura, salsa de tomate, queso muzzarella, aceitunas, orégano", "Masa con harina, levadura y agua. Estirar, salsa, queso y hornear 15 min bien fuerte."],
["Fugazzeta rellena", "Rápidas","harina, levadura, cebolla, queso muzzarella, orégano, aceite de oliva", "Rellenar la masa con muzzarella, cubrir con cebolla y hornear 25 min."],
["Fainá", "Rápidas","harina de garbanzo, aceite de oliva, orégano", "Mezclar harina de garbanzo con agua, reposar 2 h. Hornear en molde aceitado 20 min."],
["Sándwiches de miga", "Rápidas","pan de miga, jamón cocido, queso cremita, huevos, tomate", "Armar capas finas con jamón y queso. Cortar en triángulos."],
["Pastel de papa", "Rápidas","papas, carne picada, cebolla, huevos, leche, manteca, queso rallado", "Armar una base de picadillo, cubrir con puré y gratinar 20 min."],
["Zapallitos rellenos", "Rápidas", "zapallitos, carne picada, cebolla, queso muzzarella, salsa de tomate", "Hervir zapallitos, ahuecar y rellenar. Gratinar con salsa y queso."],
["Flan con dulce de leche", "Postres", "huevos, leche, azúcar, vainilla, dulce de leche", "Caramelo en el molde, mezclar huevos, leche y azúcar. Baño María 50 min. Servir frío."],
["Panqueques con dulce de leche", "Postres", "harina, huevos, leche, dulce de leche, manteca", "Batir mezcla de panqueque, cocinar finos, rellenar con dulce de leche y enrollar."],
["Arroz con leche", "Postres","arroz, leche, azúcar, canela, limón", "Cocinar el arroz con leche y cáscara 40 min hasta cremoso. Terminar con canela."],
["Tortas fritas", "Postres","harina, grasa, sal, agua, azúcar", "Amasar, estirar discos con un corte al centro y freír. Perfectas con mate en días de lluvia."],
["Budín de pan","Postres","pan viejo, leche, huevos, azúcar, dulce de leche, pasas de uva", "Remojar el pan en leche, mezclar con huevos y azúcar. Hornear a baño María 1 h."],
["Alfajores de maicena", "Postres","maicena, harina, manteca, yemas, azúcar, dulce de leche, coco rallado", "Masa, estirar y cortar. Hornear 10 min. Unir con dulce de leche y rebozar con coco."],
["Chocotorta", "Postres","galletitas de chocolate, dulce de leche, queso crema, café", "Mojar galletitas en café y alternar con capas de dulce de leche y queso crema. Heladera 6 h."],
["Vigilante", "Postres", "queso fresco, dulce de batata", "Servir una rodaja de queso con una de dulce de batata."],
["Humita en chala", "Regionales", "choclo, cebolla, queso cremoso, pimentón, albahaca, chalas", "Rallar el choclo, mezclar con cebolla rehogada, queso y pimentón. Rellenar las chalas, atar y hervir 30 min."],
["Tamales", "Regionales", "harina de maíz, carne, cebolla, pimentón, comino, huevos, aceitunas, chalas", "Armar masa con harina de maíz y caldo. Rellenar con carne guisada, huevo y aceituna. Envolver en chala y hervir 40 min."],
["Chipá", "Regionales", "almidón de mandioca, queso cremoso, huevos, manteca, leche", "Amasar todo, formar bolitas y hornear 20 min a 200°."],
["Sopa paraguaya", "Regionales", "harina de maíz, cebolla, queso cremoso, huevos, leche, manteca", "Mezclar todo con cebolla rehogada y hornear 40 min. Es un budín salado."],
["Cordero patagónico al asador", "Regionales", "cordero, sal gruesa, chimichurri, limón", "Cocinar a la cruz con fuego bajo 3-4 h, salando al final. Servir con chimichurri."],
["Cazuela de mariscos", "Regionales", "mariscos, cebolla, morrón, salsa de tomate, crema de leche, vino blanco", "Rehogar verduras, sumar vino y salsa, cocinar los mariscos 8 min y terminar con crema."],
["Surubí a la parrilla", "Pescados", "surubí, limón, ajo, perejil, aceite de oliva", "Marinar con ajo, limón y perejil. Grillar 6-8 min por lado."],
["Merluza a la romana", "Pescados", "merluza, harina, huevos, limón, aceite", "Pasar los filetes por harina y huevo, freír y servir con limón."],
["Pejerrey frito", "Pescados","pejerrey, harina, limón, aceite", "Enharinar y freír en aceite bien caliente hasta que estén dorados."],
["Merluza al horno con papas", "Pescados","merluza, papas, cebolla, limón, morrón", "Hornear papas y cebolla 30 min, sumar la merluza 15 min con limón."],
["Sopa crema de zapallo", "Sopas", "zapallo, cebolla, papas, caldo, crema de leche", "Hervir verduras en caldo, procesar y terminar con crema."],
["Sopa de verduras con fideos", "Sopas", "zanahoria, papas, zapallo, cebolla, fideos, caldo", "Hervir las verduras 20 min y sumar fideos 8 min."],
["Guiso de mondongo", "Guisos", "mondongo, papas, zanahoria, cebolla, morrón, salsa de tomate, porotos", "Hervir el mondongo hasta tierno, sumar verduras y salsa. Cocinar 1 h."],
["Guiso carrero","Guisos", "fideos, carne, papas, cebolla, morrón, salsa de tomate, choclo", "Rehogar carne y verduras, sumar salsa y agua. Hervir y agregar los fideos al final."],
["Albóndigas con salsa","Carnes", "carne picada, pan rallado, huevos, ajo, perejil, salsa de tomate", "Mezclar y formar bolitas. Dorar y cocinar en la salsa 20 min."],
["Milanesa de pollo", "Carnes","pechuga, huevos, pan rallado, limón, ajo","Filetear, pasar por huevo y pan rallado. Freír u hornear."],
["Suprema a la Maryland","Carnes", "pechuga, huevos, pan rallado, bananas, choclo, papas", "Milanesa de pollo servida con banana frita, choclo y papas."],
["Bife a la criolla", "Carnes", "bife, cebolla, morrón, tomate, papas, vino tinto", "Sellar el bife, rehogar cebolla, morrón y tomate con vino. Cocinar unos 20 min con papas."],
["Costillitas de cerdo al horno", "Carnes","costillas de cerdo, papas, miel, mostaza, ajo", "Pincelar con miel, mostaza y ajo. Hornear 1.5 h a 180°."],
["Pollo a la parrilla","Carnes", "pollo, limón, ajo, perejil, sal gruesa","Abrir el pollo, marinar y cocinar a fuego bajo 1 h."],
["Pollo al verdeo", "Carnes", "pollo, cebolla de verdeo, crema de leche, vino blanco", "Dorar el pollo, sumar el verdeo, el vino y la crema. Cocinar tapado 30 min."],
["Hamburguesas caseras", "Carnes", "carne picada, pan de hamburguesa, queso cheddar, lechuga, tomate", "Formar medallones, cocinar 4 min por lado y armar con queso y verduras."],

["Papas rellenas", "Rápidas","papas, carne picada, cebolla, huevos, queso muzzarella", "Rellenar papas hervidas con picadillo y queso. Gratinar."],
["Berenjenas a la napolitana", "Rápidas", "berenjena, salsa de tomate, queso muzzarella, huevos, pan rallado", "Rebozar rodajas, hornear, cubrir con salsa y queso y gratinar."],
["Tortilla de acelga","Rápidas","acelga, huevos, cebolla, queso rallado", "Rehogar acelga y cebolla, sumar huevos y queso. Cuajar al horno o en sartén."],

["Tarta caprese", "Tartas", "tapas de tarta, tomate, queso muzzarella, albahaca, huevos, crema de leche", "Rellenar con tomate, queso, albahaca y huevos con crema. Hornear 35 min."],

["Sándwich de milanesa completo", "Rápidas","nalga, pan francés, lechuga, tomate, huevos, queso muzzarella","Milanesa dorada en pan con lechuga, tomate, huevo y queso."],
["Tostado de jamón y queso", "Rápidas","pan de miga, jamón cocido, queso muzzarella, manteca", "Armar el sándwich y tostar en sartén con manteca hasta que derrita el queso."],
